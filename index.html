<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Tips</title>
<h1> Hey traveler! </h1>
<h2> Press below to select a destination </h2>
</head> 

<p id="message"> Destination List: </p>

<button id="myButton">Click Here</button> 
<style>
    body {
        font-family: "Times New Roman", serif;
        background-color: #d6faff;
    }
    h1 {
        color: #0f904b;
    }
    button {
        background-color: #71c974;
        color: white;
        padding: 20px 20px;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background-color: #42b9d9;
    }
</style>

<script>
const button = document.getElementById("myButton");
button.addEventListener("click", function() { document.getElementById("message").innerHTML = "You have selected a destination!"; });
    console.log("Button clicked!");
</script>
